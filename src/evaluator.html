/* Compsilon admin · Platform Evaluator (served at /admin/evaluator inside the admin tab). Layout: survey wizard (navy band header, one question per screen) then a long evaluation report with KPI charts for the top 5 and full detail below */
:root{

  --c0:#1c1c3a; --c1:#4c3a1a; --c2:#145a4a; --c3:#06d6a0; --c3ink:#06060e;
  --font-display:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;margin:0;padding-block:0 48px}
.evhead{max-width:1180px;margin:0 auto 18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.evhead h1{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--ink);margin:0 0 6px}
.evhead p{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
.band{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 100%);color:var(--on-navy);border-bottom:3px solid var(--teal);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 20px}
.band-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.brand{font-family:var(--font-data);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
h1{font-family:var(--font-display);font-size:1.75rem;line-height:1.15;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance;color:var(--on-navy)}
.band p{margin:6px 0 0;color:var(--on-navy-muted);max-width:62ch;font-size:.95rem}
.band .btn{background:transparent;color:var(--on-navy);border-color:#3a4c80}
.band .btn:hover{border-color:var(--teal)}
.main{padding:24px 32px 0}

.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:1180px}
h2{font-family:var(--font-display);font-size:1.3rem;margin:0;text-wrap:balance}
h3{font-family:var(--font-display);font-size:1.08rem;margin:0;text-wrap:balance}
h4{margin:14px 0 6px;font-size:.72rem;font-family:var(--font-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tag{font-family:var(--font-data);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
a{color:var(--teal-ink)}
.btn{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:9px 16px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--teal-ink)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#06060e;font-weight:700}
.btn.primary:hover:not(:disabled){background:#05c091}
.btn.navy{background:var(--navy2);border-color:var(--navy2);color:var(--on-navy);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border:0;background:none;color:var(--teal-ink);padding:0;font-weight:600}
:focus-visible{outline:2px solid var(--teal-ink);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.nav{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.nav-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.85rem;margin-bottom:8px}
.nav-top b{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.steps{display:flex;flex-wrap:wrap;gap:6px;padding:2px}
.step{flex:0 0 auto;min-width:38px;height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--font-data);font-size:.82rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.step.done{background:var(--teal-soft);border-color:var(--teal-ink);color:var(--ink)}
.step.current{outline:2px solid var(--teal-ink);outline-offset:1px;color:var(--ink);font-weight:600}
.meter{height:4px;background:var(--c0);border-radius:2px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px}
.qcard h2{font-size:1.4rem}
.hint{color:var(--muted);margin:-6px 0 0;font-size:.92rem}
.options{display:flex;flex-direction:column;gap:8px}
label.opt{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px 14px;cursor:pointer}
label.opt input{accent-color:var(--teal-ink);margin:3px 0 0;width:18px;height:18px;flex:0 0 auto}
label.opt .lt{font-weight:600}
label.opt .ld{display:block;color:var(--muted);font-size:.86rem}
label.opt:has(input:checked){border-color:var(--teal-ink);background:var(--teal-soft)}
.otherwrap{display:flex;flex-direction:column;gap:6px;font-size:.92rem;font-weight:600}
.otherwrap input{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
label.opt:focus-within{outline:2px solid var(--teal-ink);outline-offset:1px}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.msg{font-size:.86rem;color:var(--bad);min-height:1.2em}
.review-list{display:flex;flex-direction:column}
.rv{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.rv:first-child{border-top:0}
.rv .n{font-family:var(--font-data);color:var(--teal-ink);font-size:.85rem;padding-top:1px}
.rv .a{color:var(--muted);font-size:.9rem}
.rv.miss .a{color:var(--bad)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;background:linear-gradient(120deg,#0d0d1e 0%,#1a1a44 100%);color:var(--on-navy);border:1px solid var(--line);border-left:6px solid var(--teal)}
.hero .tag{color:var(--teal)}
.hero .name{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1.1;margin:4px 0 8px;color:var(--on-navy)}
.hero p{color:var(--on-navy-muted)}
.hero .note{color:var(--on-navy-muted)}
.hero b{color:var(--on-navy)}
.hero .pill{border-color:#3a4c80;color:var(--on-navy-muted)}
.hero .pill.short{border-color:var(--teal);color:var(--teal)}
.hero .big{color:var(--teal)}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}.hero .scorebox{text-align:left!important}}
.score{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.big{font-family:var(--font-data);font-size:3rem;font-weight:600;color:var(--teal-ink);line-height:1}
.pill{display:inline-block;font-family:var(--font-data);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.short{border-color:var(--teal-ink);color:var(--teal-ink)}
.pill.low{border-color:var(--warn);color:var(--warn)}
.pill.ex{border-color:var(--bad);color:var(--bad)}
.pill.easy{border-color:var(--good);color:var(--good)}
.pill.moderate{border-color:var(--warn);color:var(--warn)}
.pill.complex{border-color:var(--bad);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;border-radius:6px;padding:4px 9px;background:var(--c0)}
.chip b{font-family:var(--font-data);font-size:.72rem;margin-left:4px;color:var(--teal-ink)}
ul.tight{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.scroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--teal);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-family:var(--font-data);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--font-data);font-size:1.55rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi em{font-style:normal;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.charts{display:flex;flex-direction:column;gap:26px}
.chart{border-top:1px solid var(--line);padding-top:16px}
.chart:first-child{border-top:0;padding-top:0}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:.82rem;color:var(--muted);margin:8px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin:8px 0 4px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
table.t{border-collapse:collapse;width:100%;font-size:.86rem}
.t th{text-align:left;font-size:.7rem;font-family:var(--font-data);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line);vertical-align:bottom}
.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.t td.num{font-family:var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.t tr.topr td{background:var(--teal-soft)}
.t.wide{min-width:900px}
table.matrix{border-collapse:separate;border-spacing:3px;font-size:.82rem;min-width:980px;width:100%}
.matrix th{font-weight:600;text-align:center;vertical-align:bottom;padding:4px;font-size:.74rem;line-height:1.25}

.matrix td{text-align:center;padding:6px 4px;border-radius:4px;font-family:var(--font-data);font-variant-numeric:tabular-nums}
.s0{background:var(--c0);color:var(--muted)} .s1{background:var(--c1);color:var(--ink)} .s2{background:var(--c2);color:var(--ink)} .s3{background:var(--c3);color:var(--c3ink);font-weight:600}

.matrix td.gap{box-shadow:inset 0 0 0 2px var(--bad)}

.prio{font-family:var(--font-data);font-size:.68rem;color:var(--muted);margin-left:6px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.vbox{background:var(--bg);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}

.genbar{height:8px;background:var(--c0);border-radius:4px;overflow:hidden;margin:6px 0 4px}

.gensteps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:.95rem;color:var(--muted)}
.gensteps li{display:flex;align-items:center;gap:10px}
.gensteps .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
.gensteps li.now{color:var(--ink)}
.gensteps li.now .dot{border-color:var(--teal);border-top-color:transparent;animation:spin .8s linear infinite}
.gensteps li.done{color:var(--ink)}
.gensteps li.done .dot{background:var(--teal);border-color:var(--teal)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.genbar i{transition:none}.gensteps li.now .dot{animation:none;background:var(--teal-soft)}}
.pdfstatus{background:var(--teal-soft);border:1px solid var(--teal-ink);border-radius:8px;padding:12px 14px;font-size:.92rem}
.pdfstatus.err{background:var(--c1);border-color:var(--warn)}
.toast{font-size:.88rem;color:var(--good);min-height:1.2em}
.exportbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
textarea#copyFallback{width:100%;height:220px;font-family:var(--font-data);font-size:.8rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
footer.site{max-width:1180px;margin:28px auto 0;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.84rem;color:var(--muted)}
footer.site b{font-family:var(--font-display);color:var(--ink);letter-spacing:.06em}
</style>

function onPick(q,t){
  if(q.multi){

    let arr=all.filter(i=>i.checked).map(i=>i.value);

  } else {state[q.id]=t.value;$("msg").textContent=""}

}
function answerText(q){

/* ---------- scoring ---------- */
function weights(){
  const w={};Object.keys(DIMS).forEach(k=>w[k]=0);
  Q.forEach(q=>{const sel=q.multi?(state[q.id]||[]):[state[q.id]];q.opts.forEach(o=>{if(sel.includes(o[0]))for(const k in o[3])w[k]+=o[3][k]})});
  for(const k in w)w[k]=Math.min(w[k],5);
  return w;
}
function selectedInts(){const m={wiz:"wiz",jira:"ticketing",snow:"ticketing",siem:"siem"};return [...new Set((state.integrations||[]).map(i=>m[i]).filter(Boolean))]}
const INTNAME={wiz:"Wiz",ticketing:"Jira/ServiceNow",siem:"SIEM"};
function intMatch(v){const sel=selectedInts();const hit=sel.filter(k=>v.cap[k]>=2);return {hit:hit.length,of:sel.length,names:sel.map(k=>INTNAME[k]+(v.cap[k]>=2?" ✓":" ✗")).join(" · ")}}
const REGN={us:"the US",eu:"the EU",uk:"the UK",apac:"Asia-Pacific"};
const COSTL=["","£","££","£££"];
function clientClouds(){const c=new Set(state.clouds||[]);(state.eco||[]).forEach(e=>{if(e in CLOUDN)c.add(e)});if(c.size>1)c.delete("saasonly");return [...c]}
function wantsSelf(){return has("hosting","inhouse")||has("hosting","selfvpc")}
function selfOnly(){return wantsSelf()&&!has("hosting","saas")&&!has("hosting","anycloud")&&!has("hosting","nomatter")}
function costFor(v){return v.eco==="microsoft"&&has("eco","microsoft")?1:v.cost}
function hostFit(v){
  const c=clientClouds();const parts=[];if(wantsSelf())parts.push(v.selfhost);
  c.forEach(x=>{if(x in CLOUDN)parts.push(v.clouds[x]);else if(x==="onprem")parts.push(v.selfhost);else if(x==="saasonly")parts.push(v.toolkit?0:3)});
  if(!parts.length)return 100;
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length/3*100);
}
function readiness(v){
  let s={Easy:100,Moderate:70,Complex:40}[v.ease];
  if(state.timeline==="d30"&&v.deploy[1]>30)s-=20;
  if(state.timeline==="d90"&&v.deploy[1]>90)s-=10;
  return Math.max(0,s);
}
function weightSet(){let dep={d30:.2,d90:.12,flex:.05}[state.timeline]||.12;let host=.15;if(state.vprio==="capability"){dep=Math.min(dep,.08);host=.12}return {cap:1-host-dep,host,dep}}
function catScore(v,dims){return Math.round(dims.reduce((a,k)=>a+v.cap[k],0)/dims.length/3*100)}
function prio(n){return n>=3?"High":n>=2?"Medium":"Low"}
function score(){
  const w=weights();const total=Object.values(w).reduce((a,b)=>a+b,0);
  const needs=Object.keys(w).filter(k=>w[k]>0).sort((a,b)=>w[b]-w[a]);
  const W=weightSet();
  const list=VENDORS.map(v=>{
    let raw=0;for(const k in w)raw+=w[k]*(v.cap[k]/3);
    let fit=total?raw/total*100:0;const notes=[];let excluded=null;
    if(v.eco==="microsoft"){
      if(has("eco","microsoft")||has("eco","azure")){fit+=8;notes.push("Builds on the client's Microsoft 365 estate and existing licences.")}
      else{fit-=20;notes.push("Covers Microsoft-hosted agents only, so a weak fit outside Microsoft 365.")}
    }
    if(v.stack){
      if(state.stack===v.stack){fit+=10;notes.push("Extends the client's existing security vendor, console and contract.")}
      else if(v.id==="zscaler"){fit-=6;notes.push("Inline controls need the client's traffic routed through Zscaler.")}
    }
    if(selfOnly()&&v.selfhost<2)excluded="No self-hosted or in-house option stated";
    else if(wantsSelf()&&v.selfhost<2){fit-=3;notes.push("The client prefers self-hosting; this tool is run in the vendor's cloud.")}
    if(v.toolkit)notes.push("Point toolkit for Amazon Bedrock models only. Guardian and Recon are sold today as part of Palo Alto Prisma AIRS.");
    if(v.soc)notes.push("AI SOC analyst, not an AI agent security tool: it investigates alerts, so it cannot meet the monitoring and protection needs on its own.");
    const regs=(state.region||[]).filter(r=>r!=="any");
    if(regs.length){const rn=regs.map(r=>REGN[r]).join(", ");
      if(v.regions){const miss=regs.filter(r=>!v.regions.includes(r));if(miss.length){fit-=4;notes.push(`Data hosting in ${miss.map(r=>REGN[r]).join(", ")} not confirmed publicly.`)}else notes.push(`Offers data hosting in ${rn}.`)}
      else if(v.selfhost>=2)notes.push(`Can keep data in ${rn} by self-hosting; confirm SaaS hosting regions in writing.`);
      else notes.push(`Confirm in writing that data and logs can be hosted in ${rn}.`)}
    const vp=state.vprio,sz=v.size;
    if(vp==="large"){if(sz==="large")fit+=6;else if(sz==="startup"){fit-=10;notes.push("Start-up: add change-of-control and exit terms to the contract.")}}
    if(vp==="mid"){if(sz==="mid")fit+=6;else if(sz==="startup")fit-=3}
    if(vp==="startup"){if(sz==="startup")fit+=6;else if(sz==="mid")fit+=2;else fit-=6;if(sz==="startup")notes.push("Start-up vendor: typically lower cost; add change-of-control and exit terms.")}
    if(vp==="budget"){const c=costFor(v);fit+=c===1?6:c===3?-8:0;notes.push(`Indicative cost level ${COSTL[c]} (relative; most vendors do not publish prices).`)}
    if(has("integrations","other"))notes.push(`Confirm a connector for ${state.integrationsOther||"the other tools the client named"}, or plan a webhook or API build.`);
    selectedInts().forEach(k=>{if(v.cap[k]<=1)notes.push(`${INTNAME[k]} connector not confirmed publicly; get it in writing or plan a webhook or API build.`)});
    if((has("detect","agentbeh")||has("detect","userbeh"))&&v.cap.behaviour<=1)notes.push("Behaviour-pattern detection is limited; mostly rule and policy driven.");
    if(has("detect","mcp")&&v.cap.mcp<=1)notes.push("MCP server discovery and control are limited or not confirmed.");
    if(has("respond","contain")&&v.cap.runtime<3)notes.push("Automatic containment is partial.");
    if(has("respond","prevent")&&v.cap.runtime<2)notes.push("Little in-path prevention; mainly detects and alerts.");
    if(has("respond","alert")&&v.cap.ticketing<2&&v.cap.siem<2)notes.push("Automatic alert and ticket routing not confirmed.");
    clientClouds().forEach(c=>{if(c in CLOUDN&&v.clouds[c]<=1)notes.push(`Limited coverage for workloads on ${CLOUDN[c]}.`)});
    if(clientClouds().includes("onprem")&&v.selfhost<2)notes.push("No self-hosted option for on-premises workloads.");
    if((state.regs||[]).includes("dora"))notes.push("DORA/NIS2: record as an ICT third party and agree an exit plan.");
    fit=Math.round(Math.max(0,Math.min(100,fit)));
    const hf=hostFit(v),rd=readiness(v);
    const overall=Math.round((W.cap*fit+W.host*hf+W.dep*rd)*10)/10;
    const strengths=needs.filter(k=>v.cap[k]===3);
    const gaps=needs.filter(k=>w[k]>=3&&v.cap[k]<=1);
    const weak=needs.filter(k=>w[k]<3&&v.cap[k]<=1);
    return {...v,fitScore:fit,hostFit:hf,ready:rd,overall,notes,excluded,strengths,gaps,weak};
  }).sort((a,b)=>(a.excluded?1:0)-(b.excluded?1:0)||(a.soc?2:a.toolkit?1:0)-(b.soc?2:b.toolkit?1:0)||b.overall-a.overall);
  return {w,needs,W,list};
}

/* 12-month risk outcomes */
const RISKS=[
 {dim:"injection",when:()=>has("threats","injection")||has("monitor","homegrown"),text:"Prompt-injection attacks that hijack an agent or pull data out through hidden instructions"},
 {dim:"dlp",when:()=>has("threats","dlp")||((state.data||[]).length&&!has("data","none")),text:"Personal or confidential data pasted into AI tools or sent to models"},
 {dim:"runtime",when:()=>has("threats","actions")||["act","code","money"].some(a=>has("autonomy",a)),text:"An agent sending, deleting or changing records without approval"},
 {dim:"identity",when:()=>has("threats","breach")||["act","code","money","multi"].some(a=>has("autonomy",a)),text:"A breach through over-permissioned agents or leaked agent credentials"},
 {dim:"workforce",when:()=>has("monitor","workforce"),text:"Shadow-AI tools used with company data without anyone knowing"},
 {dim:"saas",when:()=>has("monitor","saas"),text:"Risky Copilot Studio or Agentforce agents built by business users going unreviewed"},
 {dim:"coding",when:()=>has("monitor","coding"),text:"Coding agents running destructive commands on developer machines"},
 {dim:"mcp",when:()=>has("detect","mcp")||has("monitor","coding"),text:"Agents connecting to malicious or unvetted MCP servers"},
 {dim:"models",when:()=>has("monitor","models")||has("detect","models"),text:"A backdoored or unsafe model imported into production"},
 {dim:"behaviour",when:()=>has("detect","agentbeh")||has("detect","userbeh"),text:"Unusual user or agent behaviour, such as sudden bulk data access, going unnoticed"},
 {dim:"redteam",when:()=>has("threats","testing"),text:"Releasing an agent with weaknesses an attacker can exploit"},
 {dim:"governance",when:()=>has("threats","evidence")||((state.regs||[]).length&&!has("regs","none")),text:"Failing an audit or regulator request for evidence of AI controls"}
];
const OUT=[["Not covered","s0"],["Partly detected","s1"],["Reduced","s2"],["Prevented or strongly reduced","s3"]];
function risks(){return RISKS.filter(r=>r.when())}

  k.forEach((t,i)=>{const x=M+(i%4)*(kw+3),yy=y+Math.floor(i/4)*(kh+3);stroke(PC.line);doc.setLineWidth(0.3);doc.rect(x,yy,kw,kh);fill(PC.teal);doc.rect(x,yy,kw,1.2,"F");

     const a=W.cap*v.fitScore/100*AW,b=W.host*v.hostFit/100*AW,c=W.dep*v.ready/100*AW;

     font("bold",8.5);col(PC.ink);doc.text(v.overall.toFixed(1),AX+a+b+c+2,yy+5.3)});

  {const cw=(CW-LBL)/CATS.length,rh=8;font("bold",7.5);col(PC.muted);CATS.forEach(([n],j)=>doc.text(n,AX+j*cw+cw/2,y+3,{align:"center"}));y+=5;
   top5.forEach((v,i)=>{const yy=y+i*rh;font(i?"normal":"bold",8.5);col(PC.ink);doc.text(T(v.name),M,yy+5);
     CATS.forEach(([n,d],j)=>{const val=catScore(v,d),l=val<25?0:val<50?1:val<75?2:3;fill(PC.lvl[l]);doc.rect(AX+j*cw+0.6,yy+0.6,cw-1.2,rh-1.2,"F");font("bold",8.5);col(l===3?PC.white:PC.ink);doc.text(String(val),AX+j*cw+cw/2,yy+5.2,{align:"center"})})});
   y+=top5.length*rh+4;para("Scored from public product evidence, regardless of this client's answers.",8,PC.muted)}
  // timeline

  legend([[PC.amber,"Proof of concept"],[PC.teal,"Production rollout"]]);
  {const rh=11,y0=y,max=Math.max(90,...top5.map(v=>v.deploy[1])),tw=AW-10,X=d=>AX+d/max*tw;
   const ticks=[];for(let t=0;t<=max;t+=15)ticks.push({v:t,p:t/max});axis(AX,tw,ticks,v=>v+"d",y0,y0+top5.length*rh);
   top5.forEach((v,i)=>{const yy=y0+i*rh;font(i?"normal":"bold",8.5);col(PC.ink);doc.text(T(v.name),M,yy+6);
     fill(PC.amber);doc.rect(X(v.poc[0]),yy+1.2,Math.max(1,X(v.poc[1])-X(v.poc[0])),3.6,"F");font("normal",7);col(PC.muted);doc.text(`PoC ${v.poc[0]}-${v.poc[1]}d`,X(v.poc[1])+1.5,yy+4.3);
     fill(PC.teal);doc.rect(X(v.deploy[0]),yy+5.8,Math.max(1,X(v.deploy[1])-X(v.deploy[0])),3.6,"F");doc.text(`Live ${v.deploy[0]}-${v.deploy[1]}d`,X(v.deploy[1])+1.5,yy+8.9)});
   y=y0+top5.length*rh+9}
  // ratings
  need(65);h3("User ratings (Gartner Peer Insights, out of 5)",10.5);
  {const rh=8,y0=y,aw=AW-20,X=r=>AX+r/5*aw;axis(AX,aw,[0,1,2,3,4,5].map(v=>({v,p:v/5})),v=>String(v),y0,y0+top5.length*rh);
   top5.forEach((v,i)=>{const yy=y0+i*rh;font(i?"normal":"bold",8.5);col(PC.ink);doc.text(T(v.name),M,yy+5);
     if(v.rev.g){fill(PC.amber);doc.rect(AX,yy+1.5,X(v.rev.g.r)-AX,4.6,"F");font("bold",8);col(PC.ink);doc.text(`${v.rev.g.r.toFixed(1)}  (${v.rev.g.n} rating${v.rev.g.n>1?"s":""})`,X(v.rev.g.r)+2,yy+5)}
     else{font("italic",8);col(PC.muted);doc.text(T(v.rev.gnote||"No rating found"),AX+1,yy+5)}});
   y=y0+top5.length*rh+9;para("Small samples for newer vendors; treat as a signal, not proof.",8,PC.muted)}

  /* ranking */
  h2("3. Full ranking");
  table({head:[["#","Tool","Type","Overall","Capability","Hosting","Deployment","PoC","Go-live","Cost*","Gartner"]],
    body:R.list.map((v,i)=>[v.excluded?"-":String(i+1),v.name+(v.short?" (shortlist)":""),v.kind,v.excluded?"Excluded":v.overall.toFixed(1),v.fitScore+"%",v.hostFit+"%",v.ease,`${v.poc[0]}-${v.poc[1]}d`,`${v.deploy[0]}-${v.deploy[1]}d`,COSTL[costFor(v)],v.rev.g?v.rev.g.r.toFixed(1)+" ("+v.rev.g.n+")":"-"]),
    styles:{fontSize:7.6},columnStyles:{1:{cellWidth:40,fontStyle:"bold"}},
    didParseCell:d=>{if(d.section==="body"&&d.row.index===0){d.cell.styles.fillColor=[220,247,238]}}});
  para("AI SOC analysts (Dropzone AI, Prophet AI) and the Protect AI AWS Toolkit are listed after the platforms because they cannot meet the client's needs on their own. *Indicative relative cost level (£ low to £££ high); most vendors do not publish prices. PoC and go-live times are estimates.",8,PC.muted);

  /* 12-month */
  if(RK.length){h2("4. What the top 5 can prevent or reduce in the next 12 months");
    table({head:[["Risk",...top5.map(v=>v.name)]],body:RK.map(r=>[r.text,...top5.map(v=>OUT[v.cap[r.dim]][0])]),styles:{fontSize:7.6},columnStyles:{0:{cellWidth:52}},didParseCell:lvlCell});
    para("Expected effect once the tool is deployed and tuned, judged from its capabilities; not a guarantee.",8,PC.muted)}

  /* detail */
  h2((RK.length?"5":"4")+". Top 5 in detail");
  top5.forEach((v,i)=>{
    need(40);h3(`${i+1}. ${v.name}  ·  ${v.overall.toFixed(1)}/100`,11.5);
    para(`${v.kind}${v.short?" · client shortlist":""} · ${v.ease} to deploy`,8.5,PC.muted,"italic",1);
    para(v.fit,9,PC.ink);
    const rows=[["Monitors",listByCat(v,["workforce","saas","homegrown","coding","models","mcp"],2).join("; ")||"Limited"],["Detects",listByCat(v,["injection","behaviour","dlp"],2).join("; ")||"Limited"],["Prevents",listByCat(v,["runtime","dlp","identity"],2).join("; ")||"Alerts only"],["Guardrails",v.guard],
      ["Hosting fit",`AWS ${LEVEL[v.clouds.aws]}, Azure ${LEVEL[v.clouds.azure]}, Google Cloud ${LEVEL[v.clouds.gcp]}, self-hosted ${LEVEL[v.selfhost]}. ${v.hostTxt}`],
      ["Deployment",`${v.ease}. Proof of concept ${v.poc[0]}-${v.poc[1]} days; production ${v.deploy[0]}-${v.deploy[1]} days (estimate). ${v.claim}`],
      ["Indicative cost",`${COSTL[costFor(v)]} (${({large:"large vendor",mid:"mid-size vendor",startup:"start-up"})[v.size]})`],
      ["Integrations",`${pdfInt(v)}. ${v.int}`],
      ["Reviews",(v.rev.g?`Gartner Peer Insights ${v.rev.g.r.toFixed(1)}/5 from ${v.rev.g.n} rating${v.rev.g.n>1?"s":""}. ${v.rev.g.t}`:`Gartner Peer Insights: ${v.rev.gnote||"no rating found"}.`)+" "+(v.rev.tp?`Trustpilot ${v.rev.tp.s.toFixed(1)}/5 from ${v.rev.tp.n} reviews (${v.rev.tp.note}).`:"No Trustpilot profile found.")],
      ["Fit for this client",[...v.notes,v.watch].join(" ")]];
    if(v.gaps.length)rows.push(["High-priority gaps",v.gaps.map(k=>DIMS[k]).join(", ")]);
    table({body:rows,columnStyles:{0:{cellWidth:34,fontStyle:"bold",textColor:PC.navy}},alternateRowStyles:{}});
    if(RK.length)table({head:[["Risk over the next 12 months","Expected effect"]],body:RK.map(r=>[r.text,OUT[v.cap[r.dim]][0]]),styles:{fontSize:7.8},columnStyles:{1:{cellWidth:48}},didParseCell:lvlCell});
    y+=2;
  });

  /* integrations */
  h2((RK.length?"6":"5")+". Integration and detection fit");
  table({head:[["Tool","Wiz","Jira / tickets","SIEM / SOAR","Behaviour analytics","MCP security"]],body:R.list.map(v=>[v.name,...["wiz","ticketing","siem","behaviour","mcp"].map(k=>v.cap[k]<=1?v.cap[k]+" - not confirmed":v.cap[k]+" - "+LEVEL[v.cap[k]])]),styles:{fontSize:7.6},columnStyles:{0:{cellWidth:44,fontStyle:"bold"}}});

  /* next steps + method */
  h2((RK.length?"7":"6")+". Next steps");
  const second=(top5[1]||top5[0]);
  [`Run a proof of concept with ${top.name} and ${second.name} on the client's own environment (about ${top.poc[1]} and ${second.poc[1]} days).`,
   `Test a prompt injection hidden in a document or tool result, sensitive data pasted into an AI tool, and an agent attempting an unapproved action. Each should be blocked or flagged${selectedInts().length?", with the alert reaching "+selectedInts().map(k=>INTNAME[k]).join(", "):""}.`,
   `Ask each vendor for a sample evidence pack mapped to ${regsText()||"the client's internal AI policy"}, and written confirmation of data hosting locations.`,
   "Re-score with PoC results, then negotiate change-of-control, renewal price cap and integration commitments."].forEach((t,i)=>para(`${i+1}.  ${t}`,9.5,PC.ink,"normal",1.5));
  h2("Method and sources");
  para("Capability scores (0 none to 3 strong) come from public vendor documentation and independent coverage as of October 2026. Deployment timelines and cost levels are estimates. Ratings come from Gartner Peer Insights and Trustpilot; most enterprise AI security vendors have no Trustpilot profile, and existing profiles are company-wide.",8.5,PC.muted);
  const src=[];R.list.forEach(v=>{if(v.rev.g)src.push([`Gartner Peer Insights: ${v.name}`,v.rev.g.url]);if(v.rev.tp)src.push([`Trustpilot: ${v.name}`,v.rev.tp.url])});
  src.push(["OWASP Top 10 for Agentic Applications","https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026"],["Pillar Security: agentic AI security platforms compared","https://www.pillar.security/blog/best-agentic-ai-security-platforms-enterprise-2026"]);
  font("normal",7.8);src.forEach(([t,u])=>{need(4.2);col(PC.ink);doc.text(T(t)+": ",M,y+3);const w=doc.getTextWidth(T(t)+": ");col(PC.tealInk);doc.textWithLink(u,M+w,y+3,{url:u});y+=4.2});

  /* frame, running header and footer on every page */
  const n=doc.getNumberOfPages();

    stroke(PC.navy);doc.setLineWidth(0.8);doc.rect(7,7,PW-14,PH-14);

    stroke(PC.teal);doc.setLineWidth(0.6);doc.line(M,PH-17,PW-M,PH-17);

    doc.text(`Page ${i} of ${n}`,PW-M,PH-12,{align:"right"});
  }

}
async function getCap(name){try{if(window.claude&&window.claude.use)return await window.claude.use(name)}catch(e){}return null}
let statusBox=null;
async function exportPDF(ev){
  const btn=(ev&&ev.currentTarget)||$("pdfBtn"),box=$(btn.dataset.status||"pdfStatus");statusBox=box;box.hidden=true;box.innerHTML="";
  if(!window.jspdf||!window.jspdf.jsPDF||!window.jspdf.jsPDF.API.autoTable){showStatus("The PDF engine didn't load (the network may have blocked cdn.jsdelivr.net). Reload the page and try again.",true);return}
  btn.disabled=true;btn.textContent="Preparing PDF…";
  let blob,filename;
  try{const {iso}=reportData();blob=buildPDF().output("blob");filename=`Independent-Tool-Evaluation-Report-${iso}.pdf`}
  catch(e){showStatus("The PDF couldn't be built: "+esc(e&&e.message||e),true);resetBtn();return}
  if(!(window.claude&&window.claude.use)){try{const d2=buildPDF();d2.save(filename);showStatus(`Downloaded <b>${esc(filename)}</b>. Check your Downloads folder.`)}catch(e){showStatus("The PDF couldn't be saved: "+esc(e&&e.message||e),true)}resetBtn();return}
  let reason="";
  const d=await getCap("downloads");
  if(d){try{await d.save({filename,data:blob});showStatus(`Saved <b>${esc(filename)}</b>. Check your Downloads folder.`);resetBtn();return}
    catch(e){const c=e&&e.code;if(c==="declined"){showStatus("Download cancelled. Click the button again and choose Save in the prompt.");resetBtn();return}
      if(c==="rate_limited"){showStatus("A save prompt is already open. Finish it, then try again.");resetBtn();return}
      reason=c||"save failed"}}
  else reason="downloads not available in this view";
  const a=await getCap("assets");
  if(a){try{const r=await a.upload(blob,{type:"application/pdf"});
      showStatus(`Your PDF is ready. <a href="${esc(r.url)}" target="_blank" rel="noopener"><b>Open the PDF report</b></a> in a new tab, then save it from your browser's PDF viewer (download icon, or Ctrl+S / Cmd+S).`);resetBtn();return}
    catch(e){reason+=" / upload: "+(e&&e.code||"failed")}}
  /* last resort: no platform capability in this view, so hand the PDF to the browser directly */
  const url=URL.createObjectURL(blob);let w=null;
  try{w=window.open(url,"_blank")}catch(e){}
  if(w){showStatus("The PDF opened in a new tab. Save it from there with the download icon, or Ctrl+S / Cmd+S.");resetBtn();return}
  showStatus(`This view can't save files directly (${esc(reason)}). Use the PDF preview below: its download icon saves the report. If no preview appears, open the Fit Finder in its own browser tab at <b>claude.ai/artifact/L3FvxxwNoStvRPM4N3Vyct</b> and click Download again.
    <iframe src="${url}" title="PDF report preview" style="display:block;width:100%;height:80vh;margin-top:10px;border:1px solid var(--line);border-radius:6px;background:#fff"></iframe>
    <div style="margin-top:8px"><a href="${url}" target="_blank" rel="noopener"><b>Open the PDF in a new tab</b></a></div>`,true);
  resetBtn();
  function resetBtn(){btn.disabled=false;btn.textContent="Download PDF report"}
}
function showStatus(html,err){const box=statusBox||$("pdfStatus");box.innerHTML=html;box.hidden=false;box.classList.toggle("err",!!err)}
function toast(m){const el=$("toast");if(!el)return;el.textContent=m;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.textContent=""},4000)}

function show(){
  const res=state.submitted&&doneCount()===TOTAL;
  $("survey").hidden=res;$("results").hidden=!res;$("wrap").classList.toggle("wide",res);
  if(res)renderResults();else{renderNav();renderStage()}
  window.scrollTo({top:0});
}
$("resetBtn").onclick=()=>{state={step:0};save();show()};
$("sampleBtn").onclick=()=>{state={...JSON.parse(JSON.stringify(SAMPLE)),step:TOTAL,submitted:false};save();show()};
window.__fit={buildPDF:()=>buildPDF()};
show();
})();
